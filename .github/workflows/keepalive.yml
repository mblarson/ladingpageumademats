name: Supabase Keepalive Ping

on:
  schedule:
    # Cron schedule usa horário UTC.
    # 11:00 Horário de Brasília (UTC-3) = 14:00 UTC
    - cron: '0 14 * * *'
  
  # Permite testar clicando no botão no GitHub
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase
        run: |
          # URL e Chave do seu projeto
          SUPABASE_URL="https://qvsjlvdiuxuotlmdmtzr.supabase.co"
          SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2c2psdmRpdXh1b3RsbWRtdHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3Mjc2NzksImV4cCI6MjA4MjMwMzY3OX0.dc726TbFIssNIyjNAe6E5lfB0786Osb2D3KG91yOQso"
          
          # Comando para inserir o log
          curl -X POST "$SUPABASE_URL/rest/v1/automation_logs" \
          -H "apikey: $SUPABASE_KEY" \
          -H "Authorization: Bearer $SUPABASE_KEY" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{ "event_type": "keepalive_github", "status": "success", "details": { "source": "github_actions", "note": "Daily Ping 11am BRT" } }'
